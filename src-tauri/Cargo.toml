[package]
name = "void-player"
version = "1.3.0"
description = "Privacy-focused, offline-first music player with cyberpunk aesthetics"
authors = ["anacondy"]
license = "MIT"
repository = "https://github.com/anacondy/Void-player-"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "void_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "void-player"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
